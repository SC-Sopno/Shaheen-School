<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<title>SC TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{color-scheme:dark;--bg:#09101d;--panel:#111b2d;--panel2:#17243a;--text:#f3f6ff;--muted:#94a4bd;--accent:#5eead4;--line:#263651;--danger:#fca5a5}
:root.light{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--panel2:#eef3f9;--text:#101827;--muted:#66758a;--accent:#0f9f8b;--line:#d7e0ec;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#152541 0,#09101d 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;transition:background .2s,color .2s}.wrap{width:min(1120px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:9px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#08201d;font-weight:900}.top h1{margin:0;font-size:clamp(18px,4vw,26px);letter-spacing:-.4px}.count{color:var(--muted);font-size:12px}.player{background:rgba(17,27,45,.92);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 10px 35px #0003}.light .player{background:rgba(255,255,255,.92);box-shadow:0 10px 35px #0001}.player-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.player h2{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:11px;color:#08201d;background:var(--accent);border-radius:999px;padding:4px 8px;white-space:nowrap}.video-shell{position:relative;width:100%;background:#03060b;border-radius:10px;overflow:hidden;line-height:0}
.video{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#03060b;max-height:62vh;object-fit:contain}
.fullscreen-btn{position:absolute;right:9px;top:9px;z-index:5;display:grid;place-items:center;width:40px;height:40px;border:1px solid #ffffff55;border-radius:9px;background:#08101dcc;color:#fff;font-size:23px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fullscreen-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.video-shell:fullscreen{width:100%;height:100%;border-radius:0;display:grid;place-items:center;background:#000}
.video-shell.pseudo-fullscreen{position:fixed;inset:0;z-index:99999;width:100vw;height:100dvh;border-radius:0;display:grid;place-items:center;background:#000}
.video-shell.pseudo-fullscreen .video{width:100%;height:100%;max-height:100%;aspect-ratio:auto;object-fit:contain}
.video-shell.pseudo-fullscreen .fullscreen-btn{top:calc(env(safe-area-inset-top, 0px) + 12px);right:calc(env(safe-area-inset-right, 0px) + 12px)}
.video-shell:fullscreen .video{width:100%;height:100%;max-height:100%;aspect-ratio:auto;object-fit:contain}
.video-shell:fullscreen .fullscreen-btn{top:calc(env(safe-area-inset-top, 0px) + 12px);right:calc(env(safe-area-inset-right, 0px) + 12px)}
@media(max-width:700px){.video{max-height:none}.video-shell{border-radius:8px}.fullscreen-btn{width:42px;height:42px;right:7px;top:7px}}.status{color:var(--muted);font-size:12px;min-height:18px;margin:7px 2px}.quality-row{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:7px}.quality-label{color:var(--muted);font-size:12px}.quality{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;min-height:34px;outline:none}.quality:focus{border-color:var(--accent)}.quality:disabled{opacity:.55;cursor:not-allowed}.source-select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;min-height:34px;max-width:72%;min-width:0}.source-select:disabled{opacity:.55;cursor:not-allowed}.filters{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.filters input,.filters select,.language,.theme{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:13px;outline:none;min-height:40px;touch-action:manipulation}.filters input{flex:1 1 240px;min-width:130px}.filters select{flex:0 1 170px;min-width:0}.filters select:focus,.language:focus,.theme:focus{border-color:var(--accent)}.channels{background:rgba(17,27,45,.88);border:1px solid var(--line);border-radius:14px;padding:10px}.light .channels{background:rgba(255,255,255,.88)}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px;max-height:52vh;overflow:auto;padding-right:2px}.card{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid transparent;border-radius:9px;padding:7px;cursor:pointer;transition:.15s;background:#101a2b;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.light .card{background:#f3f6fa}.card:hover,.card.active{background:var(--panel2);border-color:#355073}.logo,.initial{width:31px;height:31px;flex:0 0 31px;border-radius:8px}.logo{object-fit:contain;background:#24324a}.initial{display:grid;place-items:center;background:linear-gradient(135deg,#273854,#164e63);color:var(--accent);font-size:13px;font-weight:800;border:1px solid #ffffff20}.info{min-width:0}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:2px;color:var(--muted);font-size:10px}.empty{text-align:center;color:var(--muted);padding:28px;grid-column:1/-1}.tool-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px;font-size:12px;cursor:pointer;white-space:nowrap}.tool-btn:hover,.tool-btn.active{border-color:var(--accent);background:var(--panel2)}.fav-btn{margin-left:auto;border:0;background:transparent;color:#8190a8;font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}.fav-btn.on{color:#f6bd60}.logo-fallback{width:31px;height:31px;flex:0 0 31px;border-radius:8px;object-fit:contain;background:#24324a}.creator-row{display:flex;justify-content:flex-end;align-items:center;margin:0 0 5px}.creator-link{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:1px solid #3b5274;background:linear-gradient(135deg,#1b2c46,#142238);color:#dceaff;text-decoration:none;font-size:11px;font-weight:750;letter-spacing:.2px;box-shadow:0 2px 8px #0002;transition:.15s}.creator-link:hover,.creator-link:focus-visible{border-color:var(--accent);background:var(--panel2);color:var(--accent);transform:translateY(-1px);outline:none}.creator-link:active{transform:translateY(0)}
@media(max-width:700px){.wrap{width:100%;padding:8px}.top{margin-bottom:9px;align-items:flex-start}.brand{min-width:0;flex:1}.brand-mark{width:30px;height:30px;flex:0 0 30px}.top h1{font-size:clamp(16px,5vw,22px);line-height:1.2}.top>div:last-child{flex-wrap:wrap;justify-content:flex-end;max-width:52%;gap:5px}.count{width:100%;text-align:right}.player{padding:9px;border-radius:12px}.player-head{margin-bottom:7px}.player h2{font-size:15px}.video{border-radius:8px;aspect-ratio:16/9;max-height:none}.quality-row{justify-content:space-between}.quality{flex:1;max-width:170px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:55vh}.card{padding:7px;gap:6px;min-height:48px}.name{font-size:12px}.meta{font-size:9px}.logo,.initial{width:28px;height:28px;flex-basis:28px}.filters{gap:5px;flex-wrap:wrap}.filters input{flex:1 1 100%;min-width:0;padding:9px 10px;font-size:12px;min-height:38px}.filters select{flex:1 1 0;width:0;max-width:none;min-width:0;padding:8px 5px;font-size:11px;min-height:38px}.tool-btn{min-height:36px;padding:7px 9px}.language,.theme{padding:8px 7px;font-size:12px;max-width:105px;min-height:38px}}
@media(max-width:380px){.wrap{padding:7px}.top>div:last-child{max-width:58%}.language,.theme{max-width:88px;font-size:11px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.card{padding:6px}.name{font-size:11px}.meta{font-size:8px}.filters{gap:4px}.filters select{padding:7px 3px;font-size:10px}.filters input{font-size:11px}}
@media(min-width:701px){.list{min-height:70px}.filters select{min-height:42px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand"><div class="brand-mark">SC</div><h1 id="appTitle"> TV</h1></div><div style="display:flex;align-items:center;gap:8px"><select id="language" class="language"><option value="bn" selected>বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option></select><select id="theme" class="theme"><option value="auto" selected>Auto</option><option value="dark">🌙 Dark</option><option value="light">☀️ Light</option></select><span id="count" class="count"></span></div></header>
<section class="player"><div class="player-head"><h2 id="title">একটি চ্যানেল নির্বাচন করুন</h2><span id="badge" class="badge">Live Tv</span><button id="retryBtn" class="tool-btn" type="button" title="বর্তমান Stream আবার চালু করুন">↻</button></div><div id="videoShell" class="video-shell"><video id="video" class="video" controls playsinline webkit-playsinline></video><button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="ভিডিও বড় করুন" title="ভিডিও বড় করুন">⛶</button></div><div id="status" class="status">নিচের তালিকা থেকে একটি চ্যানেল নির্বাচন করুন।</div><div class="creator-row"><a class="creator-link" href="https://www.qrcodechimp.page/page/sc-sopno" target="_blank" rel="noopener noreferrer" aria-label="Create by SC_Sopno — প্রোফাইল খুলুন">✦ Create by <strong>SC_Sopno</strong> ↗</a></div><div class="quality-row"><span id="sourceLabel" class="quality-label">Stream Link</span><select id="sourceSelect" class="source-select" disabled><option value="0">Default</option></select></div><div class="quality-row"><span id="qualityLabel" class="quality-label">Quality</span><select id="quality" class="quality" disabled><option value="-1">Auto</option></select></div></section>
<section class="channels"><div class="filters"><input id="search" type="search" placeholder="চ্যানেলের নাম লিখে খুঁজুন…" autocomplete="off" aria-label="চ্যানেল খুঁজুন"><select id="country"><option value="all">সব দেশ</option><option value="bd">বাংলাদেশ</option><option value="in">ভারত</option></select><select id="category"><option value="all">সব ক্যাটাগরি</option></select><button id="favoritesOnly" class="tool-btn" type="button" aria-pressed="false">☆ প্রিয়</button><button id="resetFilters" class="tool-btn" type="button">রিসেট</button></div><div id="list" class="list"></div></section>
</main>
<script>
let data=[],hls=null,categoryList=[],activeChannel=null,playAttempt=0,playTimer=null,favoritesOnly=false;const favorites=new Set(JSON.parse(localStorage.getItem('sc-tv-favorites')||'[]').map(Number));const $=id=>document.getElementById(id);
const I18N={
bn:{title:'একটি চ্যানেল নির্বাচন করুন',live:'Live Tv',status:'নিচের তালিকা থেকে একটি চ্যানেল নির্বাচন করুন।',all:'সব দেশ',bd:'বাংলাদেশ',in:'ভারত',allCategories:'সব ক্যাটাগরি',search:'চ্যানেলের নাম লিখে খুঁজুন…',favorites:'☆ প্রিয়',reset:'রিসেট',empty:'কোনো চ্যানেল পাওয়া যায়নি',loading:'Stream লোড হচ্ছে…',created:'Create by SC_Sopno ',noUrl:'এই চ্যানেলের stream URL নেই।',ready:'Stream প্রস্তুত। Play চাপুন।',failed:'এই stream ব্রাউজারে চালানো যায়নি।',noHls:'এই ব্রাউজারে HLS playback সমর্থিত নয়।',api:'apis.json লোড করা যায়নি। index.html ও apis.json একই folder-এ রাখুন।',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality পাওয়া যায়নি'},
en:{title:'Select a channel',live:'Live Tv',status:'Select a channel from the list below.',all:'All countries',bd:'Bangladesh',in:'India',allCategories:'All categories',search:'Search channels…',favorites:'☆ Favorites',reset:'Reset',empty:'No channels found',loading:'Loading stream…',created:'Create by SC_Sopno ',noUrl:'This channel has no stream URL.',ready:'Stream ready. Press Play.',failed:'This stream could not be played in the browser.',noHls:'HLS playback is not supported in this browser.',api:'Could not load apis.json. Keep index.html and apis.json in the same folder.',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality information unavailable'},
hi:{title:'एक चैनल चुनें',live:'Live Tv',status:'नीचे दी गई सूची से एक चैनल चुनें।',all:'सभी देश',bd:'बांग्लादेश',in:'भारत',allCategories:'सभी श्रेणियाँ',search:'चैनल खोजें…',favorites:'☆ पसंदीदा',reset:'रीसेट',empty:'कोई चैनल नहीं मिला',loading:'स्ट्रीम लोड हो रही है…',created:'Create by SC_Sopno ',noUrl:'इस चैनल का stream URL नहीं है।',ready:'स्ट्रीम तैयार है। Play दबाएँ।',failed:'यह स्ट्रीम ब्राउज़र में नहीं चल सकी।',noHls:'इस ब्राउज़र में HLS playback समर्थित नहीं है।',api:'apis.json लोड नहीं हो सकी। index.html और apis.json को एक ही folder में रखें।',quality:'Quality',auto:'Auto',source:'Source',qualityUnavailable:'Quality जानकारी उपलब्ध नहीं है'}
};
let lang='bn';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function applyLanguage(){
 const t=I18N[lang];document.documentElement.lang=lang;
 $('appTitle').textContent='India & Bangladesh TV';$('title').textContent=t.title;$('badge').textContent=t.live;
 $('status').textContent=t.status;$('qualityLabel').textContent=t.quality;$('sourceLabel').textContent=t.source;
 const co=$('country');co.options[0].textContent=t.all;co.options[1].textContent=t.bd;co.options[2].textContent=t.in;$('category').options[0].textContent=t.allCategories;$('search').placeholder=t.search;$('favoritesOnly').textContent=favoritesOnly?'★ '+t.favorites.replace(/^☆ /,''):t.favorites;$('resetFilters').textContent=t.reset;
 if(!hls) resetQuality(); else refreshQualityLabels();render();
}
function applyTheme(){
 const saved=localStorage.getItem('tv-theme')||'auto';
 const isDark=saved==='dark'||(saved==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.classList.toggle('light',!isDark);document.body.classList.toggle('light',!isDark);$('theme').value=saved;
}
function fallbackIcon(name){
 const n=String(name||'TV').trim(),words=n.split(/\s+/).filter(Boolean);
 const top=(words[0]||'TV').slice(0,8).toUpperCase(),bottom=(words.slice(1).join(' ')||'CHANNEL').slice(0,13).toUpperCase();
 const palette=n.toLowerCase().includes('sony')?['#111827','#e11d48']:n.toLowerCase().includes('zee')?['#312e81','#f59e0b']:n.toLowerCase().includes('star')?['#1d4ed8','#f97316']:['#17324f','#0d9488'];
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${palette[0]}"/><stop offset="1" stop-color="${palette[1]}"/></linearGradient></defs><rect width="96" height="96" rx="18" fill="url(#g)"/><rect x="5" y="5" width="86" height="86" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/><text x="48" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="${top.length>6?17:24}" font-weight="900" fill="#fff">${esc(top)}</text><text x="48" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">${esc(bottom)}</text></svg>`;
 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}
function render(){
 const co=$('country').value,cat=$('category').value,query=$('search').value.trim().toLowerCase();
 const rows=data.filter(c=>(co==='all'||c.country_code===co)&&(cat==='all'||String(c.category||'OTHER').toUpperCase()===cat)&&(!query||c.name.toLowerCase().includes(query))&&(!favoritesOnly||favorites.has(Number(c.id))));
 $('count').textContent=`${rows.length}/${data.length}`;
 $('list').innerHTML=rows.length?rows.map(c=>`<div class="card ${activeChannel?.id===c.id?'active':''}" data-id="${c.id}"><img class="logo-fallback" src="${c.logo_url?esc(c.logo_url):fallbackIcon(c.name)}" alt="${esc(c.name)} logo" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallbackIcon(c.name)}'" onload="if(this.naturalWidth<8||this.naturalHeight<8){this.onerror=null;this.src='${fallbackIcon(c.name)}'}"><div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.country)} · ${c.streams.length} stream</div></div><button class="fav-btn ${favorites.has(Number(c.id))?'on':''}" data-fav="${c.id}" type="button" aria-label="প্রিয় তালিকায় যোগ করুন">${favorites.has(Number(c.id))?'★':'☆'}</button></div>`).join(''):`<div class="empty">${I18N[lang].empty}</div>`;
 document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openChannel(+x.dataset.id));
 document.querySelectorAll('[data-fav]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const id=Number(btn.dataset.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('sc-tv-favorites',JSON.stringify([...favorites]));render()});
}
function updateCategories(){
 const select=$('category'),current=select.value;
 const categories=categoryList.length?categoryList:[...new Set(data.map(c=>String(c.category||'OTHER').trim().toUpperCase()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 select.innerHTML=`<option value="all">${esc(I18N[lang].allCategories)}</option>`+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 select.value=categories.includes(current)?current:'all';
}
function openChannel(id){
 const c=data.find(x=>x.id===id);if(!c)return;activeChannel=c;
 document.querySelectorAll('.card').forEach(x=>x.classList.toggle('active',+x.dataset.id===id));
 $('title').textContent=`${c.name} · ${c.country}`;populateSources(c,0);play(c.streams[0]?.url,c,0);window.scrollTo({top:0,behavior:'smooth'});
}
function populateSources(channel,selected=0){
 const el=$('sourceSelect'),streams=channel?.streams||[];
 el.innerHTML=streams.map((st,i)=>{let host='Stream '+(i+1);try{host=new URL(st.url).hostname}catch(_){}const label=st.quality||st.label||st.source||'Stream';return `<option value="${i}">${i+1}. ${esc(label)} · ${esc(host)}</option>`}).join('');
 el.disabled=streams.length===0;el.value=String(Math.min(selected,Math.max(0,streams.length-1)));
}
function resetQuality(){
 const q=$('quality');q.innerHTML=`<option value="-1">${I18N[lang].auto}</option>`;q.disabled=true;
}
function refreshQualityLabels(){
 const q=$('quality');if(q.options[0])q.options[0].textContent=I18N[lang].auto;
}
function populateQuality(){
 const q=$('quality');q.innerHTML=`<option value="-1">${I18N[lang].auto}</option>`;
 if(!hls||!hls.levels||!hls.levels.length){q.disabled=true;return}
 const bestByHeight=new Map();
 hls.levels.forEach((level,index)=>{
   const height=Number(level.height)||0;
   if(height>0){
     const old=bestByHeight.get(height);
     if(old===undefined || (Number(level.bitrate)||0)>(Number(hls.levels[old].bitrate)||0)) bestByHeight.set(height,index);
   }
 });
 const levels=[...bestByHeight.entries()].sort((a,b)=>b[0]-a[0]);
 if(!levels.length){
   const o=document.createElement('option');o.value="-1";o.textContent=I18N[lang].source;q.appendChild(o);q.disabled=true;return;
 }
 levels.forEach(([height,index])=>{
   const o=document.createElement('option');o.value=String(index);o.textContent=`${height}p`;q.appendChild(o);
 });
 q.value='-1';q.disabled=false;
}
function clearPlayTimer(){if(playTimer){clearTimeout(playTimer);playTimer=null}}
function play(url,channel=null,streamIndex=0){
 clearPlayTimer();const attempt=++playAttempt;resetQuality();
 if(!url){$('status').textContent=I18N[lang].noUrl;return}
 if(hls){hls.destroy();hls=null}
 const v=$('video');v.pause();v.removeAttribute('src');v.load();
 $('sourceSelect').value=String(streamIndex);
 $('status').textContent=streamIndex>0?`বিকল্প Stream ${streamIndex+1} চেষ্টা হচ্ছে…`:I18N[lang].loading;
 let switched=false,firstMediaLoaded=false;
 const tryNext=(reason='')=>{
   if(switched||attempt!==playAttempt)return;switched=true;clearPlayTimer();
   if(hls){hls.destroy();hls=null}
   const nextIndex=streamIndex+1,next=(channel?.streams||[])[nextIndex];
   if(next?.url){$('status').textContent=`Stream ${streamIndex+1} কাজ করছে না${reason?' ('+reason+')':''}। বিকল্প ${nextIndex+1} চেষ্টা হচ্ছে…`;populateSources(channel,nextIndex);play(next.url,channel,nextIndex)}
   else $('status').textContent='এই চ্যানেলের কোনো Stream চালু করা যায়নি। Source থেকে অন্য লিংক বেছে নিন।';
 };
 const startPlayback=()=>{if(attempt!==playAttempt)return;v.play().catch(()=>{$('status').textContent='Stream লোড হয়েছে। Play চাপুন।'})};
 // A manifest may load while its media segments fail. Timeout and fatal errors
 // trigger fallback to the next source; CORS/geo restrictions cannot be bypassed.
 playTimer=setTimeout(()=>{if(!firstMediaLoaded)tryNext('সময় শেষ');},18000);
 if(window.Hls&&Hls.isSupported()){
   hls=new Hls({enableWorker:true,lowLatencyMode:false,manifestLoadingTimeOut:12000,levelLoadingTimeOut:12000,fragLoadingTimeOut:15000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:1});
   hls.on(Hls.Events.ERROR,(_,d)=>{
     if(attempt!==playAttempt)return;
     if(d.fatal){
       if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(_){tryNext('media error')}}
       else tryNext(d.details||'stream error');
     }
   });
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{if(attempt!==playAttempt)return;populateQuality();startPlayback()});
   hls.on(Hls.Events.FRAG_LOADED,()=>{if(attempt!==playAttempt)return;firstMediaLoaded=true;clearPlayTimer();$('status').textContent='Stream প্রস্তুত। Play চাপুন।'});
   hls.loadSource(url);hls.attachMedia(v);
 }else if(v.canPlayType('application/vnd.apple.mpegurl')){
   v.src=url;v.load();v.onloadedmetadata=()=>{if(attempt!==playAttempt)return;firstMediaLoaded=true;clearPlayTimer();startPlayback();$('status').textContent='Stream প্রস্তুত। Play চাপুন।'};
   v.onerror=()=>tryNext('video error');
 }else{$('status').textContent=I18N[lang].noHls;clearPlayTimer()}
}

async function toggleFullscreen(){
  const shell=$('videoShell'),v=$('video');
  try{
    if(document.fullscreenElement===shell){
      await document.exitFullscreen();
    }else if(shell.requestFullscreen){
      await shell.requestFullscreen();
    }else if(v.webkitEnterFullscreen){
      v.webkitEnterFullscreen();
    }else{
      shell.classList.toggle('pseudo-fullscreen');
    }
  }catch(err){
    if(v.webkitEnterFullscreen){try{v.webkitEnterFullscreen();return}catch(_){}}
    shell.classList.toggle('pseudo-fullscreen');
  }
}

async function parseM3UChannels(m3uText,startChannelId,startStreamId){
 const lines=String(m3uText||'').replace(/^\uFEFF/,'').split(/\r?\n/);
 const parsed=[];let meta=null;let channelId=startChannelId;let streamId=startStreamId;
 for(const rawLine of lines){
   const line=rawLine.trim();
   if(!line)continue;
   if(line.startsWith('#EXTINF:')){
     const comma=line.lastIndexOf(',');
     const attrText=comma>=0?line.slice(0,comma):line;
     const name=comma>=0?line.slice(comma+1).trim():'';
     const attrs={};
     for(const m of attrText.matchAll(/([\w-]+)="([^"]*)"/g))attrs[m[1]]=m[2];
     meta={name:attrs['tvg-name']||name,logo_url:attrs['tvg-logo']||null,category:attrs['group-title']||'OTHER',tvg_id:attrs['tvg-id']||''};
     continue;
   }
   if(line.startsWith('#'))continue;
   if(!/^https?:\/\//i.test(line)){meta=null;continue;}
   if(!meta)continue;
   const group=String(meta.category||'OTHER').trim().toUpperCase();
   const isBangladesh=group==='BANGLADESH'||String(meta.name||'').trim().toLowerCase()==='t sports';
   const path=line.split('?')[0].toLowerCase();
   const extension=(path.match(/\.([a-z0-9]+)$/)||[])[1]||'m3u8';
   parsed.push({
     id:channelId++,name:meta.name,country:isBangladesh?'Bangladesh':'India',country_code:isBangladesh?'bd':'in',
     logo_url:meta.logo_url,category:group,
     streams:[{id:streamId++,url:line,format:extension==='m3u8'?'hls':extension,extension,source:'shidul100/Iptv M3U',verified:false}]
   });
   meta=null;
 }
 return parsed;
}
function mergeChannelSources(primary,additional){
 const merged=Array.isArray(primary)?primary.map(c=>({...c,streams:Array.isArray(c.streams)?c.streams.slice():[]})):[];
 const keyFor=c=>`${String(c.country_code||'').toLowerCase()}|${String(c.name||'').trim().toLocaleLowerCase()}`;
 const byKey=new Map(merged.map(c=>[keyFor(c),c]));
 let nextChannelId=Math.max(0,...merged.map(c=>Number(c.id)||0))+1;
 let nextStreamId=Math.max(0,...merged.flatMap(c=>(c.streams||[]).map(s=>Number(s.id)||0)))+1;
 for(const incoming of additional){
   const key=keyFor(incoming);let target=byKey.get(key);
   if(!target){target={...incoming,id:nextChannelId++,streams:[]};merged.push(target);byKey.set(key,target)}
   if(!target.logo_url&&incoming.logo_url)target.logo_url=incoming.logo_url;
   if(!target.category&&incoming.category)target.category=incoming.category;
   for(const s of (incoming.streams||[])){
     if(!(target.streams||[]).some(old=>old.url===s.url))target.streams.push({...s,id:nextStreamId++});
   }
 }
 return merged;
}
async function loadChannelData(){
 try{
   const response=await fetch('apis.json',{cache:'no-store'});
   if(!response.ok)throw new Error('apis.json HTTP '+response.status);
   const apiData=await response.json();
   const baseChannels=Array.isArray(apiData.channels)?apiData.channels:[];
   categoryList=Array.isArray(apiData.categories)?apiData.categories.slice():[];
   const playlistUrls=Array.isArray(apiData.playlist_sources)?apiData.playlist_sources:[];
   const playlistResults=await Promise.allSettled(playlistUrls.map(async url=>{
     const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Playlist HTTP '+r.status);return r.text();
   }));
   const parsed=[];let channelId=Math.max(0,...baseChannels.map(c=>Number(c.id)||0))+1;
   let streamId=Math.max(0,...baseChannels.flatMap(c=>(c.streams||[]).map(s=>Number(s.id)||0)))+1;
   for(const result of playlistResults){
     if(result.status==='fulfilled'){
       const rows=await parseM3UChannels(result.value,channelId,streamId);
       parsed.push(...rows);
       channelId+=rows.length;streamId+=rows.reduce((n,c)=>n+c.streams.length,0);
     }
   }
   data=mergeChannelSources(baseChannels,parsed);
   updateCategories();render();
 }catch(error){
   console.error('SC TV API load error:',error);
   $('list').innerHTML=`<div class="empty">${I18N[lang].api}</div>`;
 }
}
loadChannelData();
